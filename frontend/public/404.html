<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reversia</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages - https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages has no server-side rewrite rules: it only serves whatever static file
      // matches the request path. This app uses React Router's BrowserRouter (clean URLs, no
      // "#"), so a client-side route like /admin/shopify-sync only exists once index.html's JS
      // has loaded and React Router has taken over - a fresh request straight to that path (a
      // typed URL, a bookmark, or a hard refresh) never reaches the app at all and GitHub Pages
      // serves this 404.html instead. This script is that fallback: it re-encodes the requested
      // path into a query string and redirects to the real index.html, which the matching script
      // there (see index.html) decodes back into the original path via history.replaceState
      // BEFORE React Router ever reads window.location - so the app mounts on the correct route.
      //
      // pathSegmentsToKeep = 0 assumes this site is served at a custom domain's root, not a
      // project subpath (username.github.io/repo-name/...) - see vite.config.ts's base: "/". If
      // this is served from a github.io/<repo> subpath instead, this must become the number of
      // leading path segments to preserve (usually 1).
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
