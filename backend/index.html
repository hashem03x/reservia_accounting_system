<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Google</title>
</head>

<body>
    <h1>Sign in with Google</h1>
    <div id="g_id_onload" data-client_id="122897779167-ks1auniu3bn7afv9l8s5411370di9run.apps.googleusercontent.com"
        data-context="signin" data-ux_mode="popup" data-callback="loginCallback" data-auto_prompt="false">
    </div>

    <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="signin_with"
        data-size="medium" data-logo_alignment="left">
    </div>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script>
        function loginCallback(response) {
            console.log(response);
            if (response.error) {
                alert('Error');
            } else {
                var credential = response.credential;
                var id_token = credential;
                // console.log(id_token);
                document.write(id_token);

                // Send the token to your server
            }
        }
    </script>

</body>

</html>
