server {
    listen 80;
    server_name accounting.reversia.example.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name accounting.reversia.example.com;

    ssl_certificate /etc/letsencrypt/live/accounting.reversia.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounting.reversia.example.com/privkey.pem;

    # Increase request body size (Fixes 413 Error)
    client_max_body_size 100M;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 600;
        proxy_send_timeout    600;
        proxy_read_timeout    600;
    }
}
