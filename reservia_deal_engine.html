<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservia Deal Engine</title>
<style>
:root{--teal:#116B66;--teal-l:#D9EEEC;--gold:#C9A227;--ink:#1d2427;--mut:#5b6670;--line:#d7dde0;--bg:#f6f8f8;--yel:#fff7b0;--blue:#0b3fb8;--bad:#b42318;--ok:#067647}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e7eded;--mut:#9fb0b3;--line:#2c3a3d;--bg:#0f1719;--teal-l:#163a38;--yel:#4a4308;--blue:#8fb4ff}}
:root[data-theme="dark"]{--ink:#e7eded;--mut:#9fb0b3;--line:#2c3a3d;--bg:#0f1719;--teal-l:#163a38;--yel:#4a4308;--blue:#8fb4ff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
header{background:var(--teal);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:18px;margin:0}
header small{opacity:.85}
nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--teal-l);padding:8px 12px;border-bottom:1px solid var(--line)}
nav button{border:1px solid var(--teal);background:transparent;color:var(--teal);padding:7px 11px;border-radius:4px;cursor:pointer;font:inherit;font-weight:bold}
nav button.on{background:var(--teal);color:#fff}
main{padding:16px;max-width:1200px;margin:0 auto}
section.tab{display:none}
section.tab.on{display:block}
h2{font-size:16px;color:var(--teal);margin:6px 0 10px}
h3{font-size:14px;margin:16px 0 8px;color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{background:#162024}}
:root[data-theme="dark"] .card{background:#162024}
.card label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:4px;font:inherit;background:var(--yel);color:var(--blue)}
input:disabled{background:transparent;color:var(--ink)}
table{width:100%;border-collapse:collapse;background:transparent}
th,td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
th{background:var(--teal);color:#fff;font-weight:bold;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:bold;background:var(--teal-l)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi{background:#162024}}
:root[data-theme="dark"] .kpi{background:#162024}
.kpi b{display:block;font-size:18px;margin-top:4px}
.kpi span{font-size:12px;color:var(--mut)}
.pill{display:inline-block;padding:3px 8px;border-radius:12px;font-size:12px;font-weight:bold}
.pill.ok{background:#d1fadf;color:var(--ok)}.pill.bad{background:#fee4e2;color:var(--bad)}.pill.warn{background:#fef0c7;color:#93370d}
.note{font-size:12px;color:var(--mut);margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
button.act{background:var(--teal);color:#fff;border:0;padding:8px 12px;border-radius:4px;cursor:pointer;font:inherit;font-weight:bold}
button.sec{background:transparent;color:var(--teal);border:1px solid var(--teal);padding:7px 10px;border-radius:4px;cursor:pointer;font:inherit}
.scroll{overflow-x:auto}
.paper{background:#fff;color:#111;border:1px solid var(--line);padding:22px;border-radius:6px}
.paper h2,.paper h3{color:#116B66}
.paper table th{font-size:11px}
.lh{border-bottom:4px solid var(--gold);padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end}
.lh b{color:var(--teal);font-size:18px}
.lh small{color:#5b6670}
.tc{font-size:12px;line-height:1.5}
.tc li{margin-bottom:4px}
svg text{font-family:Arial;font-size:11px;fill:var(--mut)}
@media print{nav,header,.noprint{display:none!important}body{background:#fff}main{padding:0}section.tab{display:none!important}section.tab.print{display:block!important}.paper{border:0}}
.brand-logo{background:#ffffff;border-radius:8px;padding:4px 10px;line-height:0}.brand-logo svg{height:52px;width:auto;display:block}
</style>
</head>

  DEALS.forEach(function (d) { var m = d.prop.slice(0, 7); tm[m] = tm[m] || { n: 0, w: 0, kwp: 0, lead: [] }; tm[m].n++; if (d.status === 'Won') tm[m].w++; tm[m].kwp += d.kWp; tm[m].lead.push(days(d.lead, d.prop)); });
  var tRows = Object.keys(tm).sort().map(function (m) {

<script>
// Reservia Deal Engine: calculation core. Mirrors rde.xlsx formulas line by line.
// Pure functions only: no DOM. Used by the HTML app and tested in Node.
(function (root) {
  'use strict';

  var SECTORS = ['On-Grid C&I', 'Off-Grid', 'Agriculture Pumping', 'Utility Scale', 'Street Lighting', 'Solar Water Heating'];
  var GREATER_CAIRO = 'Cairo - 10th of Ramadan';

  function num(x) { var v = Number(x); return isFinite(v) ? v : 0; }

  function bandOf(kWp) {
    if (kWp <= 15) return 1;
    if (kWp <= 30) return 2;
    if (kWp <= 50) return 3;
    if (kWp <= 100) return 4;
    return 5;
  }

  // pb: array of price-book items with .key, .price, .n1 (Wp / kW / V), .n2 (Ah)
  function makeLookup(pb) {
    var idx = {};
    pb.forEach(function (it) { if (!(it.key in idx)) idx[it.key] = it; });
    return function (key) {
      var it = idx[key];
      if (!it) throw new Error('Price Book key not found: ' + key);
      return it;
    };
  }

  function calc(inp, data) {
    var look = makeLookup(data.items);
    var R = data.rates;
    var S = data.site_defaults || {};
    var kWp = num(inp.kWp);
    var sector = inp.Sector;
    var util = sector === 'Utility Scale';
    var onGridish = sector === 'On-Grid C&I' || util;
    var offGrid = sector === 'Off-Grid';
    var street = sector === 'Street Lighting';
    var waterHeat = sector === 'Solar Water Heating';
    var agri = sector === 'Agriculture Pumping';

    // ---- Site costs ----
    var band = bandOf(kWp);
    var ri = R.regions.indexOf(inp.Region);
    if (ri < 0) throw new Error('Region not in Rates: ' + inp.Region);
    var instRate = R.install[ri][band - 1];
    var install = kWp * instRate;
    var transport = R.transport[ri][band - 1];
    var gc = inp.Region === GREATER_CAIRO ? 1 : 0;
    var crew = num(inp.crew), days = num(inp.days);
    var fares = gc ? 0 : crew * num(inp.fare);
    var rooms = gc ? 0 : Math.ceil(crew / 2) * days;
    var hotels = rooms * num(inp.hotel);
    var perdiem = gc ? 0 : crew * days * num(inp.perdiem);
    var travel = fares + hotels + perdiem;
    var personnel = crew * days * num(inp.allowPD);
    var siteTotal = install + transport + travel + personnel;

    // ---- BOQ ----
    var pvIt = look(inp.PVKey), pvW = pvIt.n1;
    var pvQty = kWp > 0 ? Math.ceil(kWp * 1000 / pvW) : 0;
    var lines = [];
    function line(comp, key, unit, qty, price, group) {
      lines.push({ comp: comp, key: key, unit: unit, qty: qty, price: price, total: qty * price, group: group });
    }
    line('PV modules', inp.PVKey, 'pcs', pvQty, pvIt.price, 'Equipment');
    var gridIt = look(inp.InvGrid);
    line('Grid-tie inverters', inp.InvGrid, 'pcs', onGridish ? Math.ceil(kWp / gridIt.n1) : 0, gridIt.price, 'Equipment');
    var offIt = look(inp.InvOff);
    line('Off-grid inverter / charger', inp.InvOff, 'pcs', (offGrid || street || waterHeat) ? 1 : 0, offIt.price, 'Equipment');
    var batIt = look(inp.BatKey);
    line('Battery units', inp.BatKey, 'pcs', (offGrid || street) ? num(inp.BatQty) : 0, batIt.price, 'Equipment');
    var pumpIt = look(inp.PumpKey);
    line('Solar pump drive', inp.PumpKey, 'pcs', agri ? num(inp.PumpQty) : 0, pumpIt.price, 'Equipment');
    // Street lighting and solar water heating lines (PLACEHOLDER prices until supplier quotes arrive)
    var lumIt = look('Placeholder | LED street luminaire 60 W | 60 W');
    line('LED street luminaire', lumIt.key, 'pcs', street ? num(inp.Poles) : 0, lumIt.price, 'Equipment');
    var poleIt = look('Placeholder | Galvanised street pole 6 m | 6 m');
    line('Street pole (galvanised, 6 m)', poleIt.key, 'pcs', street ? num(inp.Poles) : 0, poleIt.price, 'Structures');
    var ctrlIt = look('Placeholder | Street light MPPT controller with timer | 12 V');
    line('Street light controller', ctrlIt.key, 'pcs', street ? 1 : 0, ctrlIt.price, 'Equipment');
    var hpIt = look('Placeholder | Heat pump water heater 200 L | 200 L');
    line('Heat pump water heater (200 L)', hpIt.key, 'pcs', waterHeat ? num(inp.WHUnits) : 0, hpIt.price, 'Equipment');
    var cpIt = look('Placeholder | Circulation pump and controls | 1 Ph');
    line('Circulation pump and controls', cpIt.key, 'pcs', waterHeat ? num(inp.WHUnits) : 0, cpIt.price, 'Balance of system');
    line('Mounting structure', 'Structure: ' + inp.StructType, 'kWp', kWp, R.struct[inp.StructType], 'Structures');
    var dcIt = look(inp.DCKey);
    line('DC cable', inp.DCKey, 'm', kWp * R.dcRoute, dcIt.price, 'Cabling');
    var acPrice = num(inp.ACPrice) > 0 ? num(inp.ACPrice) : look(inp.ACKey).price;
    line('AC cable', inp.ACKey, 'm', num(inp.ACm), acPrice, 'Cabling');
    line('AC distribution board', inp.ADBKey, 'pcs', 1, look(inp.ADBKey).price, 'Protection');
    line('AC breaker / MCCB', inp.BrkKey, 'pcs', 1, look(inp.BrkKey).price, 'Protection');
    line('Cable tray', inp.TrayKey, 'roll', Math.ceil(kWp / 10), look(inp.TrayKey).price, 'Cabling');
    line('MC4 connector pairs', inp.MC4Key, 'pair', Math.ceil(pvQty / 2), look(inp.MC4Key).price, 'Cabling');
    line('Earthing', 'Earthing (Rates)', 'kWp', kWp, R.earth, 'Balance of system');
    line('Accessories and misc', 'Accessories (Rates)', 'kWp', kWp, R.access, 'Balance of system');
    var sum14 = 0; lines.forEach(function (l) { sum14 += l.total; });
    line('Utility safety, walkways, fire and SCADA', '% of materials (Rates)', 'lot', util ? 1 : 0, sum14 * R.utilSafety, 'Adders');
    var sum15 = 0; lines.forEach(function (l) { sum15 += l.total; });
    line('Insurance (utility)', '% of materials (Rates)', 'lot', util ? 1 : 0, sum15 * R.insurance, 'Adders');
    line('Grid sync, testing and commissioning adder', 'EGP/kWp (Rates)', 'kWp', util ? kWp : 0, R.gridSync, 'Adders');
    var mat = 0; lines.forEach(function (l) { mat += l.total; });

    // ---- Pricing stack ----
    var cogs = mat + install + transport + travel + personnel;
    var oh = cogs * num(inp.OH), cont = cogs * num(inp.Cont), prof = cogs * num(inp.Profit);
    var pool = oh + cont + prof;
    var sales = pool * num(inp.Sales), eng = pool * num(inp.Eng);
    var base = cogs + pool + sales + eng;
    var cat = base * num(inp.Cat);
    var pre = base + cat;
    var disc = pre * num(inp.Disc);
    var net = pre - disc;
    var vat = net * num(inp.VAT);
    var gross = net + vat;
    var gp = net - cogs - sales - eng;
    var P = {
      mat: mat, install: install, transport: transport, travel: travel, personnel: personnel,
      siteTotal: siteTotal, cogs: cogs, oh: oh, cont: cont, prof: prof, pool: pool,
      sales: sales, eng: eng, base: base, cat: cat, pre: pre, disc: disc, net: net,
      vat: vat, gross: gross, perkw: kWp ? net / kWp : 0, perkwv: kWp ? gross / kWp : 0,
      gp: gp, gppct: net ? gp / net : 0, opp: gp - oh - cont, oppct: net ? (gp - oh - cont) / net : 0,
      pvQty: pvQty, band: band, instRate: instRate
    };

    // ---- Approvals ----
    var mdNeeded = net > num(inp.MDThr);
    P.chkGP = P.gppct >= num(inp.GPFloor) ? 'PASS' : 'BELOW FLOOR';
    P.chkDisc = num(inp.Disc) > num(inp.DiscAuth) ? 'Above authority: Stage 2 must review the discount' : 'Within authority';
    P.mdNeeded = mdNeeded;
    // Stage 1 = GP sign-off (Sales & Technical). Stage 2 = allocations sign-off (Sales & Commercial Director), opens only after Stage 1.
    P.stage2Open = inp.L1 === 'Approved';
    P.stage2Status = inp.L1 !== 'Approved' ? 'WAITING: Stage 1 not approved' : inp.L2;
    P.mdStatus = mdNeeded ? inp.MD : 'Not required';
    P.release = (inp.L1 === 'Approved' && P.gppct >= num(inp.GPFloor) && inp.L2 === 'Approved' && (!mdNeeded || inp.MD === 'Approved'))
      ? 'APPROVED FOR ISSUE' : 'NOT RELEASED';

    // ---- Feasibility (customer view) ----
    var yr1 = kWp * num(inp.Yield);
    var degr = num(inp.Degr), esc = num(inp.Esc), tariff = num(inp.Tariff), dr = num(inp.DR);
    var years = [], cf = [-gross], cum = [-gross], payback = null, yieldSum = 0, savSum = 0;
    for (var n = 1; n <= 25; n++) {
      var y = yr1 * Math.pow(1 - degr, n - 1);
      var t = tariff * Math.pow(1 + esc, n - 1);
      var sav = y * t;
      var prevCum = cum[n - 1];
      var nowCum = prevCum + sav;
      if (payback === null && prevCum < 0 && nowCum >= 0) payback = (n - 1) + (-prevCum) / sav;
      years.push({ n: n, yield: y, tariff: t, sav: sav, cum: nowCum });
      cf.push(sav); cum.push(nowCum);
      yieldSum += y; savSum += sav;
    }
    var npv = -gross, pv = 0;
    for (var k = 1; k <= 25; k++) { npv += cf[k] / Math.pow(1 + dr, k); }
    var F = {
      capex: gross, years: years, cf: cf,
      payback: payback === null ? 'Beyond 25 years' : payback,
      irr: irr(cf), npv: npv,
      levelised: yieldSum ? gross / yieldSum : 0,
      life: savSum, y1cov: num(inp.Consump) ? yr1 / num(inp.Consump) : 0
    };

    // ---- ERP budget (cost only) ----
    var grp = function (g) { var s = 0; lines.forEach(function (l) { if (l.group === g) s += l.total; }); return s; };
    var erp = [
      ['EQ-01', 'Equipment', grp('Equipment')], ['ST-01', 'Mounting structures', grp('Structures')],
      ['CB-01', 'Cabling', grp('Cabling')], ['PR-01', 'Protection', grp('Protection')],
      ['BS-01', 'Balance of system', grp('Balance of system')], ['AD-01', 'Utility adders', grp('Adders')],
      ['SV-01', 'Installation, testing and commissioning', install], ['SV-02', 'Transportation', transport],
      ['SV-03', 'Travel, hotels and accommodation', travel], ['SV-04', 'Site personnel allowance', personnel],
      ['OV-01', 'Overhead allocation', oh], ['OV-02', 'Contingency', cont],
      ['IN-01', 'Sales bonus', sales], ['IN-02', 'Engineering incentive', eng]
    ];
    var budget = 0; erp.forEach(function (e) { budget += e[2]; });
    P.erpTotal = budget;
    P.erpCheck = Math.round(budget - (cogs + oh + cont + sales + eng));

    return { lines: lines, P: P, F: F, erp: erp, sector: sector };
  }

  // IRR by bisection on cash flows (cf[0] negative).
  function irr(cf) {
    function npvAt(r) { var s = 0; for (var i = 0; i < cf.length; i++) s += cf[i] / Math.pow(1 + r, i); return s; }
    var lo = -0.99, hi = 5, a = npvAt(lo), b = npvAt(hi);
    if (a * b > 0) return null;
    for (var i = 0; i < 200; i++) {
      var m = (lo + hi) / 2, fm = npvAt(m);
      if (a * fm <= 0) { hi = m; b = fm; } else { lo = m; a = fm; }
    }
    return (lo + hi) / 2;
  }

  var api = { calc: calc, irr: irr, SECTORS: SECTORS, bandOf: bandOf };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.RDE = api;
})(typeof window !== 'undefined' ? window : globalThis);

function chartSVG(F) {
  var W = 720, H = 260, pad = 40;

  var sl = F.years.map(function (p) { return x(p.n).toFixed(1) + ',' + y(F.levelised).toFixed(1); }).join(' ');

  s += '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="#999"/>';
  s += '<line x1="' + pad + '" y1="' + pad + '" x2="' + pad + '" y2="' + (H - pad) + '" stroke="#999"/>';

  s += '<polyline points="' + sl + '" fill="none" stroke="#116B66" stroke-width="2.5"/>';
  s += '<text x="' + (W - pad - 170) + '" y="' + (pad + 4) + '" style="fill:#b42318">Market tariff (escalating)</text>';
  s += '<text x="' + (W - pad - 170) + '" y="' + (pad + 20) + '" style="fill:#116B66">Solution cost (levelised)</text>';

}

function cableFor(I, corr) { for (var i = 0; i < AMP.length; i++) if (AMP[i][1] * corr >= I) return AMP[i]; return null; }
function pumpCalc(L) {
  var irrFlow = 0, treeFlow = 0, codes = [];

function dashboardHTML(rg) {
  var h = '<h3>By sector</h3><div class="scroll"><table><tr><th>Sector</th><th class="n">Proposals</th><th class="n">Open</th><th class="n">Won</th><th class="n">Lost</th><th class="n">Won rate</th><th class="n">Won kWp</th><th class="n">Won production (kWh/yr)</th><th class="n">Won value excl VAT (EGP)</th></tr>';
  var tot = { p: 0, o: 0, w: 0, l: 0, kwp: 0, prod: 0, val: 0 };
  SECTORS.forEach(function (s) {
    var rs = rg.filter(function (r) { return r.sector === s; });
    var w = rs.filter(function (r) { return r.outcome === 'Won'; }), l = rs.filter(function (r) { return r.outcome === 'Lost'; });
    var o = rs.filter(function (r) { return r.outcome === 'Open'; });
    var kwp = 0, prod = 0, val = 0;
    w.forEach(function (r) { kwp += r.kWp; prod += r.prod; val += r.net; });
    tot.p += rs.length; tot.o += o.length; tot.w += w.length; tot.l += l.length; tot.kwp += kwp; tot.prod += prod; tot.val += val;
    var rate = (w.length + l.length) ? w.length / (w.length + l.length) : null;
    h += '<tr><td>' + s + '</td><td class="n">' + rs.length + '</td><td class="n">' + o.length + '</td><td class="n">' + w.length + '</td><td class="n">' + l.length + '</td><td class="n">' + (rate == null ? '-' : pc(rate)) + '</td><td class="n">' + f2(kwp) + '</td><td class="n">' + f0(prod) + '</td><td class="n">' + f0(val) + '</td></tr>';
  });
  var rateAll = (tot.w + tot.l) ? tot.w / (tot.w + tot.l) : null;
  h += '<tr class="tot"><td>All sectors</td><td class="n">' + tot.p + '</td><td class="n">' + tot.o + '</td><td class="n">' + tot.w + '</td><td class="n">' + tot.l + '</td><td class="n">' + (rateAll == null ? '-' : pc(rateAll)) + '</td><td class="n">' + f2(tot.kwp) + '</td><td class="n">' + f0(tot.prod) + '</td><td class="n">' + f0(tot.val) + '</td></tr></table></div>';
  var lead = rg.map(function (r) { return days(r.leadDate, r.propDate); }).filter(function (x) { return x != null; });
  var iss = rg.map(function (r) { return days(r.propDate, r.issueDate); }).filter(function (x) { return x != null; });
  var avg = function (a) { return a.length ? (a.reduce(function (s, x) { return s + x; }, 0) / a.length).toFixed(1) : '-'; };
  h += '<p class="note">Average days from lead to proposal: ' + avg(lead) + '. Average days from proposal to issue: ' + avg(iss) + '.</p>';
  var yr = ST.dashYear || 2026;
  h += '<h3>Proposal timing by month <input id="dashYear" type="number" value="' + yr + '" style="width:110px;display:inline-block"></h3>';
  h += '<div class="scroll"><table><tr><th>Month</th><th class="n">Proposals</th><th class="n">Won</th><th class="n">kWp proposed</th><th class="n">Production proposed (kWh/yr)</th></tr>';
  var M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  M.forEach(function (m, i) {
    var rs = rg.filter(function (r) { return r.propDate && new Date(r.propDate).getFullYear() === yr && new Date(r.propDate).getMonth() === i; });
    h += '<tr><td>' + m + '</td><td class="n">' + rs.length + '</td><td class="n">' + rs.filter(function (r) { return r.outcome === 'Won'; }).length + '</td><td class="n">' + f2(rs.reduce(function (s, r) { return s + r.kWp; }, 0)) + '</td><td class="n">' + f0(rs.reduce(function (s, r) { return s + r.prod; }, 0)) + '</td></tr>';
  });
  h += '</table></div>';
  return h;
}
function exportCSV() {
  var cols = ['dealId', 'crm', 'cust', 'sector', 'sub', 'region', 'kWp', 'net', 'perkw', 'gppct', 'leadDate', 'propDate', 'issueDate', 'outcome', 'wonDate', 'lostReason', 'prod', 'erp'];
  var out = [cols.join(',')].concat(ST.register.map(function (r) {
    return cols.map(function (c) { var v = r[c] == null ? '' : String(r[c]); return '"' + v.replace(/"/g, '""') + '"'; }).join(',');
  })).join('\n');

function paintPrices(q) {

  var rows = ST.items.map(function (it, i) { return [it, i]; }).filter(function (p) {

  });
  var html = '<tr><th>Category</th><th>Brand</th><th>Model / item</th><th>Spec</th><th>Unit</th><th class="n">Unit price (EGP)</th><th>Check date</th><th>Status</th><th>Flag</th></tr>';

}


// ---------- Rev02: supplier quotes, active price, leads, ID chain ----------
function keySet() { var o = {}; ST.items.forEach(function (i) { o[i.key] = true; }); return o; }
function quoteStatus(q, ks) {
  if (!ks[q.key]) return 'FIX KEY';
  if (q.avail !== 'Yes') return 'NOT AVAILABLE';
  var age = q.date ? Math.round((new Date(new Date().toDateString()) - new Date(q.date)) / 86400000) : 99;
  return age > 1 ? 'STALE' : 'OK';
}
// Active price = lowest available, matched supplier quote; otherwise the manual price (as in Price Book col G).
function effectiveItems() {
  var ks = keySet(), best = {};
  ST.quotes.forEach(function (q) {
    if (quoteStatus(q, ks) === 'FIX KEY' || q.avail !== 'Yes') return;
    if (best[q.key] == null || q.price < best[q.key]) best[q.key] = q.price;
  });
  return ST.items.map(function (it) {
    var o = Object.assign({}, it);
    if (best[it.key] != null) { o.price = best[it.key]; o.priceSource = 'Supplier quote'; }
    else { o.priceSource = 'Manual'; }
    return o;
  });
}
function parseCSV(text) {
  var lines = text.replace(/\r/g, '').split('\n').filter(function (l) { return l.trim() !== ''; });
  if (!lines.length) return [];
  var split = function (l) { return l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(function (c) { return c.trim().replace(/^"|"$/g, '').replace(/""/g, '"'); }); };
  var head = split(lines[0]).map(function (h) { return h.toLowerCase(); });
  return lines.slice(1).map(function (l) {
    var c = split(l), o = {};
    head.forEach(function (h, i) { o[h] = c[i] == null ? '' : c[i]; });
    return o;
  });
}
function download(name, text, mime) {
  var a = document.createElement('a');
  a.href = 'data:' + (mime || 'text/csv') + ';charset=utf-8,' + encodeURIComponent(text);
  a.download = name; a.click();
}
function saveAll() { ['quotes', 'suppliers', 'leads', 'erpReturned'].forEach(function (k) { saveLocal('rde_' + k, ST[k]); }); }

  h += '</table></div>';
  h += '<h3>Quotes held (' + ST.quotes.length + ')</h3><div class="scroll"><table><tr><th>Supplier</th><th>Item key</th><th class="n">Unit price</th><th>Availability</th><th class="n">Lead (days)</th><th>Price date</th><th>Reference</th><th>Status</th><th></th></tr>';
  ST.quotes.forEach(function (q, i) {

      '</td><td><span class="pill ' + (st === 'OK' ? 'ok' : 'warn') + '">' + st + '</span></td><td><button class="sec" data-qdel="' + i + '">Remove</button></td></tr>';
  });
  if (!ST.quotes.length) h += '<tr><td colspan="9" class="note">No quotes yet. Upload a supplier sheet above.</td></tr>';
  h += '</table></div>';
  document.getElementById('tab-suppliers').innerHTML = h; ST.flash = '';

  document.getElementById('tplQuotes').addEventListener('click', function () {
    download('rde_supplier_quote_template.csv', 'supplier,item_key,unit_price,availability,lead_days,price_date,reference\n"SAMPLE supplier","Jinko | JKM475M-7RL3 | 475W",4085,Yes,30,2026-11-04,"Quote ref"\n');
  });
  document.getElementById('quoteFile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var rows = parseCSV(rd.result), kset = keySet(), ok = 0, bad = 0;
      rows.forEach(function (r) {
        var q = { supplier: r.supplier || '', key: r.item_key || '', price: num(r.unit_price), avail: r.availability || 'Yes',
                  lead: r.lead_days || '', date: r.price_date || new Date().toISOString().slice(0, 10), ref: r.reference || '' };
        if (!q.key || !kset[q.key] || !(q.price > 0)) { bad++; return; }
        ST.quotes.push(q); ok++;
      });
      saveAll(); ST.flash = 'Loaded ' + ok + ' matched rows; ' + bad + ' held (key not in Price Book or no price).';
      refresh(false);
    };
    rd.readAsText(f);
  });
  document.getElementById('clearQuotes').addEventListener('click', function () {
    if (!confirm('Remove all supplier quotes? Prices will fall back to the manual Price Book prices.')) return;
    ST.quotes = []; saveAll(); refresh(false);
  });
  document.getElementById('addSup').addEventListener('click', function () {
    var n = document.getElementById('supName').value.trim(); if (!n) return;
    ST.suppliers.push({ name: n, cat: document.getElementById('supCat').value, terms: document.getElementById('supTerms').value, lead: document.getElementById('supLead').value });
    saveAll(); refresh(false);
  });
  document.querySelectorAll('[data-sdel]').forEach(function (el) { el.addEventListener('click', function () { ST.suppliers.splice(+el.getAttribute('data-sdel'), 1); saveAll(); refresh(false); }); });
  document.querySelectorAll('[data-qdel]').forEach(function (el) { el.addEventListener('click', function () { ST.quotes.splice(+el.getAttribute('data-qdel'), 1); saveAll(); refresh(false); }); });
}

function renderIDs() {

    ST.erpReturned[I.DealID] = e.target.value; saveAll();

// ---------- refresh ----------
function refresh(keepDealFocus) {
  var c = calcAll();
  document.getElementById('hdrDeal').textContent = ST.inp.DealID + ' | ' + ST.inp.Cust + ' | ' + ST.inp.Sector + (c.ok ? ' | ' + (c.r.P.release) : '');
  if (!c.ok) {
    ['tab-boq', 'tab-pricing', 'tab-feas', 'tab-proposal', 'tab-erp'].forEach(function (id) {
      document.getElementById(id).innerHTML = '<p class="pill bad">' + esc(c.err) + '</p><p class="note">Fix the input in the Deal tab.</p>';
    });
  } else {
    renderBOQ(c.r); renderPricing(c.r); renderFeas(c.r); renderProposal(c.r); renderERP(c.r);
  }
  if (!keepDealFocus) renderDeal();
  else {
    // keep focus on the field being edited: only refresh derived pages
    var active = document.activeElement && document.activeElement.getAttribute('data-k');
    if (!active) renderDeal();
  }
  if (ST.tab === 'register') renderRegister();
  if (ST.tab === 'prices') renderPrices();
  if (ST.tab === 'ids') renderIDs();
  if (ST.tab === 'suppliers') renderSuppliers();
  if (ST.tab === 'load') renderLoad();
  if (ST.tab === 'design') renderDesign();
}

renderDeal();
